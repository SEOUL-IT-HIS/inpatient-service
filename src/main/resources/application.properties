spring.application.name=inpatientservice

#server

server.port=8080

# Oracle DataSource

spring.datasource.url=jdbc:oracle:thin:@seoulit.pe.kr:1521/freepdb1
spring.datasource.username=inpatient
spring.datasource.password=inpatient
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

app.patient-service.host=192.168.1.149
app.patient-service.port=8080

app.admin-service.host=192.168.1.128
app.admin-service.port=8080
# mybatis

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath:/mapper/*.xml

# app.kafka.enabled=false 로 로컬 오버라이드(application-local.properties 등)하면
# 카프카 브로커 없이도 독립적으로 실행/테스트 가능 (discharge.requested/inpatient-billing-charge 발행,
# settlement.completed 구독을 모두 건너뜀)
app.kafka.enabled=true

spring.kafka.bootstrap-servers=192.168.1.132:9092

# Producer (discharge.requested ??)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer (settlement.completed ??)
spring.kafka.consumer.group-id=inpatient-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=kr.co.seoulit.his.inpatientservice.admission.event.SettlementCompletedEvent
spring.kafka.consumer.auto-offset-reset=earliest